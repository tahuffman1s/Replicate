# appimage-builder recipe (https://appimage-builder.readthedocs.io).
#
#   cd packaging/appimage && ./build-appimage.sh
#
# Bundles Python, GTK 4, libadwaita, their GI data, python-tds and the
# host tools the app shells out to (qemu-img, virsh, xorriso). libvirt's
# daemon itself and KVM stay on the host, as they must.
version: 1

script:
  - rm -rf AppDir || true
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/applications AppDir/usr/share/metainfo
  - cp ../../data/icons/io.github.tahuffman1s.Replicate.svg AppDir/usr/share/icons/hicolor/scalable/apps/
  - cp ../../data/io.github.tahuffman1s.Replicate.desktop AppDir/usr/share/applications/
  - cp ../../data/io.github.tahuffman1s.Replicate.metainfo.xml AppDir/usr/share/metainfo/
  # The application and its pure-Python dependency, installed into the AppDir's Python.
  - python3 -m pip install --no-deps --ignore-installed --prefix=/usr --root=AppDir ../.. python-tds
  - python3 -m pip install --ignore-installed --prefix=/usr --root=AppDir python-tds

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.tahuffman1s.Replicate
    name: Replicate
    icon: io.github.tahuffman1s.Replicate
    version: !ENV ${REPLICATE_VERSION}
    exec: usr/bin/python3
    exec_args: "-m replicate $@"

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-secret-1
      - gir1.2-pango-1.0
      - libadwaita-1-0
      - libgtk-4-1
      - libgtk-4-media-gstreamer
      - libsecret-1-0
      - adwaita-icon-theme
      - shared-mime-info
      - qemu-utils
      - libvirt-clients
      - xorriso
      - ca-certificates
    exclude:
      - "*-doc"
      - "*-dbg"
      - humanity-icon-theme
      - ubuntu-mono

  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
      - usr/lib/x86_64-linux-gnu/gconv

  runtime:
    env:
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/lib/python3/dist-packages:${APPDIR}/usr/lib/python3.12/site-packages"
      GI_TYPELIB_PATH: "${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0"
      GSETTINGS_SCHEMA_DIR: "${APPDIR}/usr/share/glib-2.0/schemas"
      XDG_DATA_DIRS: "${APPDIR}/usr/share:${XDG_DATA_DIRS}:/usr/local/share:/usr/share"
      # Prefer the host's libvirt client if it is newer; fall back to the bundled one.
      PATH: "${PATH}:${APPDIR}/usr/bin"

  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun --version
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun --version
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun --version

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|tahuffman1s|Replicate|latest|Replicate-*x86_64.AppImage.zsync
