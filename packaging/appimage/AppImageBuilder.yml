# appimage-builder recipe (https://appimage-builder.readthedocs.io).
#
#   cd packaging/appimage && ./build-appimage.sh
#
# Bundles Python, GTK 4, libadwaita, their GI data, python-tds and the
# host tools the app shells out to (qemu-img, virsh, xorriso). libvirt's
# daemon itself and KVM stay on the host, as they must.
version: 1

script:
  - rm -rf AppDir || true
  - mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/applications AppDir/usr/share/metainfo
  - cp ../../data/icons/io.github.tahuffman1s.Replicate.svg AppDir/usr/share/icons/hicolor/scalable/apps/
  - cp ../../data/io.github.tahuffman1s.Replicate.desktop AppDir/usr/share/applications/
  - cp ../../data/io.github.tahuffman1s.Replicate.metainfo.xml AppDir/usr/share/metainfo/
  # The application and its pure-Python dependency go into the version-neutral
  # dist-packages directory the bundled interpreter searches (PYTHONPATH below),
  # whatever Python version the build host runs.
  - python3 -m pip install --no-deps --upgrade --target AppDir/usr/lib/python3/dist-packages ../.. python-tds

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.tahuffman1s.Replicate
    name: Replicate
    icon: io.github.tahuffman1s.Replicate
    version: !ENV ${REPLICATE_VERSION}
    exec: usr/bin/python3
    exec_args: "-m replicate $@"

  apt:
    arch: amd64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-secret-1
      - python3-gssapi
      - krb5-user
      - gir1.2-pango-1.0
      - libadwaita-1-0
      - libgtk-4-1
      - libsecret-1-0
      - adwaita-icon-theme
      - librsvg2-common
      - shared-mime-info
      - qemu-utils
      - libvirt-clients
      - xorriso
      - ca-certificates
    # No broad exclude globs here on purpose: appimage-builder 1.1.0 marks
    # excluded packages as "installed" at one version and apt then upgrades
    # every match into the AppDir (hundreds of MB of -doc and -dbg packages).
    # Recommends are off, so nothing pulls docs or debug builds in by itself.
    exclude: []

  # appimage-builder 1.1.0 writes APPDIR_LIBC_LINKER_PATH as a Python set
  # ("{'lib64/ld-linux-x86-64.so.2'}"), which AppRun cannot use, so the
  # AppImage fails with "No such file or directory". Normalise it.
  # Ubuntu 24.04 is merged-/usr: libc6 puts the loader in usr/lib64 and the
  # /lib64 -> usr/lib64 link comes from base-files, which is not deployed,
  # so the bundled-glibc runtime has no lib64/ld-linux-x86-64.so.2 either.
  after_runtime:
    - sed -i -E "s/^APPDIR_LIBC_LINKER_PATH=\{'([^']*)'(, '([^']*)')*\}$/APPDIR_LIBC_LINKER_PATH=\1/" AppDir/AppRun.env
    - grep APPDIR_LIBC_LINKER_PATH AppDir/AppRun.env
    - test -e AppDir/runtime/compat/lib64 || ln -s usr/lib64 AppDir/runtime/compat/lib64
    - test -e AppDir/runtime/compat/lib || ln -s usr/lib AppDir/runtime/compat/lib
    - ls -la AppDir/runtime/compat/
    # appimage-builder writes gdk-pixbuf's loaders.cache without librsvg's
    # loader (it cannot load the module while querying), so no SVG, and no
    # icon, could be decoded from the bundle. Query again with the bundled
    # libraries on the path, keeping bare module names (GDK_PIXBUF_MODULEDIR finds them).
    # (The bundled copy of the tool is already patched for AppRun by now, so the
    # build host's gdk-pixbuf-query-loaders, from libgdk-pixbuf2.0-bin, runs here.)
    - >
      LD_LIBRARY_PATH="$PWD"/AppDir/usr/lib/x86_64-linux-gnu
      "$(command -v gdk-pixbuf-query-loaders || echo /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders)"
      "$PWD"/AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders/*.so
      | sed -E 's#^"/.*/(libpixbufloader-[^"/]+\.so)"$#"\1"#'
      > AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
    - grep -q '"svg"' AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
    - grep -c '^"libpixbufloader-' AppDir/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache

  files:
    exclude:
      - usr/share/man
      - usr/share/doc
      - usr/share/gtk-doc
      - usr/share/info
      - usr/share/locale
      - usr/lib/debug
      - usr/lib/x86_64-linux-gnu/debug
      - usr/include
      - usr/lib/x86_64-linux-gnu/gconv

  runtime:
    env:
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/lib/python3/dist-packages:${APPDIR}/usr/lib/python3.12/site-packages"
      GI_TYPELIB_PATH: "${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0"
      GSETTINGS_SCHEMA_DIR: "${APPDIR}/usr/share/glib-2.0/schemas"
      XDG_DATA_DIRS: "${APPDIR}/usr/share:${XDG_DATA_DIRS}:/usr/local/share:/usr/share"
      # Prefer the host's libvirt client if it is newer; fall back to the bundled one.
      PATH: "${PATH}:${APPDIR}/usr/bin"

  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun --version
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun --version
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun --version

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|tahuffman1s|Replicate|latest|Replicate-*x86_64.AppImage.zsync
