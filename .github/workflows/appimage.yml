name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Cut a release: tag to create for this commit (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip python3-setuptools \
            binutils coreutils desktop-file-utils fakeroot fuse libgdk-pixbuf2.0-dev libgdk-pixbuf2.0-bin patchelf \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 squashfs-tools strace util-linux zsync file
          python3 -m pip install --break-system-packages "appimage-builder==1.1.0" "packaging<22"
      - name: Build the AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Replicate-AppImage
          path: |
            packaging/appimage/Replicate-*.AppImage
            packaging/appimage/Replicate-*.AppImage.zsync
      # On a tag push the release is for that tag. On a manual run with a tag
      # name, the action creates the tag at this commit and the release with it.
      - name: Create or update the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Replicate ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            packaging/appimage/Replicate-*.AppImage
            packaging/appimage/Replicate-*.AppImage.zsync
